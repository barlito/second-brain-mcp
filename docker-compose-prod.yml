# ────────────────────────────────────────────────────────────────
# MCP server exposing the shared knowledge base (Obsidian-compatible
# Git vault) to Claude, with per-project access tokens.
# ────────────────────────────────────────────────────────────────
#
# PRODUCTION variant: same `docker stack deploy` flow as local, but
# with a registry image instead of `build:` (Swarm can't build), plus
# the prod domain/TLS.
#
# Deployable once an image tagged IMAGE_TAG is published to
# `ghcr.io/barlito/second-brain-mcp` (CI only builds it; publishing is part of
# the deploy flow) and the `vault_deploy_key` secret exists.
# Images are referenced by immutable tag: `IMAGE_TAG=<tag> make deploy.prod`.
#
# Prerequisite (once): docker secret create vault_deploy_key <private key file>
services:
  second-brain-mcp:
    image: ghcr.io/barlito/second-brain-mcp:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VAULT_PATH=/vault
      - DB_PATH=/data/acl.db
      - VAULT_REMOTE_URL=git@github.com:barlito/second-brain-vault.git
      - VAULT_BRANCH=main
      - VAULT_SYNC_INTERVAL_MS=60000
      # Swarm DNS for the Traefik tasks: only they may set X-Forwarded-For.
      - TRUSTED_PROXY=tasks.traefik_traefik
      # Web admin UI (behind Authelia): own port, only users in this group
      - ADMIN_WEB_PORT=3002
      - ADMIN_GROUP=admins
      # Shared secret Traefik injects (X-SB-Admin-Proxy) after Authelia, and the CSRF key
      - ADMIN_PROXY_SECRET=${ADMIN_PROXY_SECRET:?ADMIN_PROXY_SECRET is required (see docs/DEPLOY.md)}
      - ADMIN_WEB_SECRET=${ADMIN_WEB_SECRET:?ADMIN_WEB_SECRET is required (see docs/DEPLOY.md)}
      - GIT_SSH_COMMAND=ssh -i /run/secrets/vault_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10
      # git refuses to commit without an identity
      - GIT_AUTHOR_NAME=second-brain-mcp
      - GIT_AUTHOR_EMAIL=second-brain-mcp@noreply.local
      - GIT_COMMITTER_NAME=second-brain-mcp
      - GIT_COMMITTER_EMAIL=second-brain-mcp@noreply.local
    # One git working tree + one SQLite file: two tasks must never overlap.
    stop_grace_period: 30s
    secrets:
      - source: vault_deploy_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - vault-data:/vault
      - acl-data:/data
    networks:
      - traefik_traefik_proxy
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true

        - traefik.http.services.second-brain-mcp.loadbalancer.server.port=3000
        - traefik.http.services.second-brain-admin.loadbalancer.server.port=3002

        - traefik.http.routers.second-brain-mcp.rule=Host(`second-brain.barlito.fr`)
        - traefik.http.routers.second-brain-mcp.service=second-brain-mcp
        - traefik.http.routers.second-brain-mcp.entrypoints=http
        - traefik.http.routers.second-brain-mcp.middlewares=redirect-to-https@file

        - traefik.http.routers.second-brain-mcp-secure.rule=Host(`second-brain.barlito.fr`)
        - traefik.http.routers.second-brain-mcp-secure.service=second-brain-mcp
        - traefik.http.routers.second-brain-mcp-secure.entrypoints=https
        - traefik.http.routers.second-brain-mcp-secure.tls=true
        - traefik.http.routers.second-brain-mcp-secure.tls.certresolver=letsencrypt
        # Rate limit sized for a few agents (per source IP)
        - traefik.http.middlewares.second-brain-mcp-ratelimit.ratelimit.average=20
        - traefik.http.middlewares.second-brain-mcp-ratelimit.ratelimit.burst=40
        # Own Bearer-token ACL -> no Authelia, just rate limit + security headers
        - traefik.http.routers.second-brain-mcp-secure.middlewares=second-brain-mcp-ratelimit,security-headers@file

        # Web admin UI: Authelia SSO (Remote-User/Remote-Groups), never exposed without it
        - traefik.http.routers.second-brain-admin.rule=Host(`second-brain-admin.barlito.fr`)
        - traefik.http.routers.second-brain-admin.service=second-brain-admin
        - traefik.http.routers.second-brain-admin.entrypoints=http
        - traefik.http.routers.second-brain-admin.middlewares=redirect-to-https@file

        - traefik.http.routers.second-brain-admin-secure.rule=Host(`second-brain-admin.barlito.fr`)
        - traefik.http.routers.second-brain-admin-secure.service=second-brain-admin
        - traefik.http.routers.second-brain-admin-secure.entrypoints=https
        - traefik.http.routers.second-brain-admin-secure.tls=true
        - traefik.http.routers.second-brain-admin-secure.tls.certresolver=letsencrypt
        # Injected after Authelia (overwrites any client value): proves the request went through Traefik
        - traefik.http.middlewares.second-brain-admin-proxy.headers.customrequestheaders.X-SB-Admin-Proxy=${ADMIN_PROXY_SECRET:?ADMIN_PROXY_SECRET is required (see docs/DEPLOY.md)}
        - traefik.http.routers.second-brain-admin-secure.middlewares=second-brain-mcp-ratelimit,authelia-auth@file,second-brain-admin-proxy,security-headers@file

networks:
  traefik_traefik_proxy:
    external: true

secrets:
  vault_deploy_key:
    external: true

volumes:
  vault-data:
  acl-data:
