name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to rollback to (e.g. v1.2.0)"
        required: true
        type: string
      restore-db:
        description: "Optional: backup filename under /data/backups (e.g. acl-20260101T120000Z.db) to restore before switching the image. Needed when the target image is older than the DB schema (migrations are forward-only)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOCKER_HOST: ssh://${{ vars.SERVER_USERNAME }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_PORT }}
      SERVICE: second-brain-mcp_second-brain-mcp
      TAG: ${{ inputs.tag }}
      RESTORE_DB: ${{ inputs.restore-db }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]] || { echo "::error::invalid tag (expected vX.Y.Z[-suffix])"; exit 1; }
          [ -z "$RESTORE_DB" ] || [[ "$RESTORE_DB" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*\.db$ ]] || { echo "::error::invalid restore-db filename"; exit 1; }

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST_KEY: ${{ vars.SERVER_HOST_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::secret SSH_PRIVATE_KEY is not set"; exit 1; }
          # No trust-on-first-use: the host key must be pinned
          [ -n "$SERVER_HOST_KEY" ] || { echo "::error::variable SERVER_HOST_KEY is not set (full known_hosts line, see docs/DEPLOY.md)"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key (full known_hosts line, e.g. "[1.2.3.4]:3333 ssh-ed25519 AAAA...")
          printf '%s\n' "$SERVER_HOST_KEY" >> ~/.ssh/known_hosts
          if [ -z "$SERVER_PORT" ] || [ "$SERVER_PORT" = 22 ]; then host=$SERVER_HOST; else host="[$SERVER_HOST]:$SERVER_PORT"; fi
          ssh-keygen -F "$host" >/dev/null \
            || { echo "::error::SERVER_HOST_KEY has no entry for $host"; exit 1; }

      # Read-only Docker Hub token: --with-registry-auth stores it in the Swarm raft store.
      # The read/write token stays in release.yaml.
      - name: Login to Docker Hub (read-only)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READ_ONLY_ACCESS_TOKEN }}

      # Fail before the stop-first rollout (outage) if the image was never published
      - name: Check the image is published
        run: docker manifest inspect "barlito/second-brain-mcp:$TAG" >/dev/null

      # Safety copy of the current DB (also kept when restoring an older one)
      - name: Backup database before rollback
        continue-on-error: true
        run: make db.backup || { echo "::warning::DB backup failed, rolling back without a fresh safety copy"; exit 1; }

      - name: Restore database backup
        if: ${{ inputs.restore-db != '' }}
        run: |
          docker service scale "$SERVICE=0"
          make db.restore TAG="$TAG" file="$RESTORE_DB"

      - name: Rollback main service
        run: |
          make docker.service.update args="--replicas 1 --image barlito/second-brain-mcp:$TAG $SERVICE"
          make deploy.assert_image

      - name: Smoke test
        run: make smoke.test

      # A Swarm rollback after scale-to-0 would restore replicas=0: make sure the service runs
      - name: Ensure service is running (on failure)
        if: failure()
        run: docker service scale "$SERVICE=1"
