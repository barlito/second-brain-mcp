name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to rollback to (e.g. v1.2.0)"
        required: true
        type: string
      restore-db:
        description: "Optional: backup filename under /data/backups (e.g. acl-20260101T120000Z.db) to restore before switching the image. Needed when the target image is older than the DB schema (migrations are forward-only)."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  deployments: write

jobs:
  rollback:
    uses: barlito/ci/.github/workflows/swarm-rollback.yaml@v1
    with:
      tag: ${{ inputs.tag }}
      restore: ${{ inputs.restore-db }}
      images: barlito/second-brain-mcp
      timeout-minutes: 15
    secrets: inherit
