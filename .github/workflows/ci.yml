name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # actionlint also runs shellcheck on the run: blocks
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Shellcheck scripts
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 scripts/*.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Tests create git repos and commit in them
      - name: Configure git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@noreply.local"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Docker build
        run: docker build -t second-brain-mcp:ci .

      - name: Validate compose files
        env:
          HOST_UID: "1000"
          HOST_GID: "1000"
          # Dummy values: only checks that the files interpolate.
          ADMIN_PROXY_SECRET: ci-dummy-admin-proxy-secret-0123456789abcdef
          ADMIN_WEB_SECRET: ci-dummy-admin-web-secret-0123456789abcdef
        run: |
          docker compose -f docker-compose.yaml config -q
          TAG=ci docker compose -f docker-compose-prod.yml config -q
