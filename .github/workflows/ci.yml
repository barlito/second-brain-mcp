name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_call:
    inputs:
      docker:
        description: "Run the docker build job (release.yaml skips it: it builds the image itself)"
        type: boolean
        default: true

permissions:
  contents: read

# Under workflow_call the caller's github context applies (event_name=release, ref=tag), so this
# group never collides with release.yaml's own `release-<tag>` group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint also runs shellcheck on the run: blocks
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Shellcheck scripts
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d scripts/*.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Tests create git repos and commit in them
      - name: Configure git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@noreply.local"

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Skipped only when release.yaml calls this workflow with docker: false (its own build is the check)
    if: ${{ github.event_name != 'release' || inputs.docker }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cache is only written from main (PR caches are not restorable by other refs anyway)
      - name: Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=image,mode=max' || '' }}

      - name: Validate compose files
        env:
          HOST_UID: "1000"
          HOST_GID: "1000"
          # Dummy values: only checks that the files interpolate.
          ADMIN_PROXY_SECRET: ci-dummy-admin-proxy-secret-0123456789abcdef
          ADMIN_WEB_SECRET: ci-dummy-admin-web-secret-0123456789abcdef
        run: |
          docker compose -f docker-compose.yaml config -q
          TAG=ci docker compose -f docker-compose-prod.yml config -q
