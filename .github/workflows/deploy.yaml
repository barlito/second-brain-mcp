name: Deploy Workflow

on:
  workflow_dispatch:
    inputs:
      re-deploy:
        description: "Full stack deploy (applies the whole docker-compose-prod.yml, rolling update with rollback) instead of the image-only update. Required for the first deploy."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A crash-looping container must not keep the job spinning
    timeout-minutes: 15

    env:
      DOCKER_HOST: ssh://${{ vars.SERVER_USERNAME }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_PORT }}
      SERVICE: second-brain-mcp_second-brain-mcp

    steps:
      - name: Require a tag ref
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow on a release tag: gh workflow run deploy.yaml --ref vX.Y.Z"
            exit 1
          fi
          # Same rule as rollback.yaml: the tag ends up unquoted in Makefile recipes
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]] \
            || { echo "::error::invalid release tag '$GITHUB_REF_NAME' (expected vX.Y.Z[-suffix])"; exit 1; }

      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST_KEY: ${{ vars.SERVER_HOST_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::secret SSH_PRIVATE_KEY is not set"; exit 1; }
          # No trust-on-first-use: the host key must be pinned
          [ -n "$SERVER_HOST_KEY" ] || { echo "::error::variable SERVER_HOST_KEY is not set (full known_hosts line, see docs/DEPLOY.md)"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key (full known_hosts line, e.g. "[1.2.3.4]:3333 ssh-ed25519 AAAA...")
          printf '%s\n' "$SERVER_HOST_KEY" >> ~/.ssh/known_hosts
          if [ -z "$SERVER_PORT" ] || [ "$SERVER_PORT" = 22 ]; then host=$SERVER_HOST; else host="[$SERVER_HOST]:$SERVER_PORT"; fi
          ssh-keygen -F "$host" >/dev/null \
            || { echo "::error::SERVER_HOST_KEY has no entry for $host"; exit 1; }

      # Read-only Docker Hub token: --with-registry-auth stores it in the Swarm raft store.
      # The read/write token stays in release.yaml.
      - name: Login to Docker Hub (read-only)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READ_ONLY_ACCESS_TOKEN }}

      # Fail before the stop-first rollout (outage) if the image was never published
      - name: Check the image is published
        run: docker manifest inspect "barlito/second-brain-mcp:$GITHUB_REF_NAME" >/dev/null

      - name: Re-Deploy Stack
        if: inputs.re-deploy
        env:
          VAULT_DEPLOY_KEY: ${{ secrets.VAULT_DEPLOY_KEY }}
          # Substituted in docker-compose-prod.yml at stack deploy
          ADMIN_PROXY_SECRET: ${{ secrets.ADMIN_PROXY_SECRET }}
          ADMIN_WEB_SECRET: ${{ secrets.ADMIN_WEB_SECRET }}
          # Optional; empty -> authelia_session (compose default)
          AUTHELIA_SESSION_COOKIE: ${{ vars.AUTHELIA_SESSION_COOKIE }}
          # Versioned Swarm secret name for key rotation (docker-compose-prod.yml), default vault_deploy_key
          VAULT_DEPLOY_KEY_SECRET: ${{ vars.VAULT_DEPLOY_KEY_SECRET || 'vault_deploy_key' }}
        # No `stack rm`: deploy.prod rolls the existing stack (creates it on a first deploy)
        run: |
          [[ "$VAULT_DEPLOY_KEY_SECRET" =~ ^vault_deploy_key[A-Za-z0-9_.-]*$ ]] \
            || { echo "::error::invalid VAULT_DEPLOY_KEY_SECRET"; exit 1; }
          # Swarm secret created once per name, from stdin (never printed)
          [ -n "$VAULT_DEPLOY_KEY" ] || { echo "::error::VAULT_DEPLOY_KEY unset"; exit 1; }
          if ! docker secret inspect "$VAULT_DEPLOY_KEY_SECRET" >/dev/null 2>&1; then
            printf '%s\n' "$VAULT_DEPLOY_KEY" | docker secret create "$VAULT_DEPLOY_KEY_SECRET" - >/dev/null
            echo "Secret $VAULT_DEPLOY_KEY_SECRET created."
          fi
          TAG=$GITHUB_REF_NAME make deploy.prod

      - name: Update main service
        if: ${{ ! inputs.re-deploy }}
        run: |
          make db.backup
          make docker.service.update args="--image barlito/second-brain-mcp:$GITHUB_REF_NAME $SERVICE"
          TAG=$GITHUB_REF_NAME make deploy.assert_image

      - name: Smoke test
        if: ${{ ! inputs.re-deploy }}
        run: make smoke.test

      - name: Remove stopped containers
        if: ${{ ! inputs.re-deploy }}
        run: make deploy.prune
