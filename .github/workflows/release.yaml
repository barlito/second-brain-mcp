name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      docker: false

  release:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: barlito/ci/.github/workflows/docker-release.yaml@v1
    with:
      images: '[{"name":"second-brain-mcp","target":"runtime"}]'
    secrets: inherit
