name: Release Workflow

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # buildcache is written to GHCR (native GITHUB_TOKEN login)
      packages: write

    steps:
      - uses: actions/checkout@v7

      # type=registry cache is shared across refs (type=gha is ref-scoped: every tag would
      # start empty). It lives on GHCR, not Docker Hub, to spare the Hub pull quota.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READ_WRITE_DELETE_ACCESS_TOKEN }}

      - name: Login to GHCR (buildcache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Main Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/second-brain-mcp:${{ github.ref_name }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/second-brain-mcp:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
