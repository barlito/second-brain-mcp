name: Release Workflow

on:
  release:
    types: [published]

permissions:
  contents: read

# One build per tag; never cancel a push half-way
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Same rule as deploy.yaml/rollback.yaml: only vX.Y.Z[-suffix] tags are deployable
      - name: Require a semver tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]] \
            || { echo "::error::invalid release tag '$TAG' (expected vX.Y.Z[-suffix])"; exit 1; }

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      docker: false

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READ_WRITE_DELETE_ACCESS_TOKEN }}

      # type=gha is ref-scoped, but a tag run can restore caches written by the default branch;
      # ci.yml writes scope=image on every push to main. Read-only here (no cache-to).
      - name: Build & Push Main Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          build-args: APP_VERSION=${{ github.ref_name }}
          sbom: true
          tags: |
            barlito/second-brain-mcp:${{ github.ref_name }}
            ${{ github.event.release.prerelease == false && 'barlito/second-brain-mcp:latest' || '' }}
          cache-from: type=gha,scope=image
