# ────────────────────────────────────────────────────────────────
# MCP server exposing the shared knowledge base (Obsidian-compatible
# Git vault) to Claude, with per-project access tokens.
# ────────────────────────────────────────────────────────────────
#
# LOCAL dev file, deployed via Docker Swarm like prod. Swarm ignores
# `build:` at deploy time, so `make deploy` runs `docker compose build`
# first to produce the `second-brain-mcp:${IMAGE_TAG}` tag referenced below (unique per build, so the stack rolls)
# (no registry needed on a single-node Swarm).
#
# See docker-compose-prod.yml for the production variant.
services:
  second-brain-mcp:
    build: .
    image: second-brain-mcp:${IMAGE_TAG:-local}
    # Both mounts below are bind mounts owned by the host user, not the
    # image's appuser — run as the host uid/gid (set by `make deploy`)
    # instead. Prod uses named volumes owned by appuser (see Dockerfile),
    # so it doesn't need this.
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - VAULT_PATH=/vault
      - DB_PATH=/data/acl.db
      # No VAULT_REMOTE_URL locally: the vault is a plain local git repo.
      - VAULT_BRANCH=main
      - VAULT_SYNC_INTERVAL_MS=60000
      # Swarm DNS for the Traefik tasks: only they may set X-Forwarded-For.
      - TRUSTED_PROXY=tasks.traefik_traefik
      # git refuses to commit without an identity
      - GIT_AUTHOR_NAME=second-brain-mcp
      - GIT_AUTHOR_EMAIL=second-brain-mcp@noreply.local
      - GIT_COMMITTER_NAME=second-brain-mcp
      - GIT_COMMITTER_EMAIL=second-brain-mcp@noreply.local
    # One git working tree + one SQLite file: two tasks must never overlap.
    stop_grace_period: 30s
    volumes:
      - ../second-brain-vault-dev:/vault
      - ./data:/data
    networks:
      - traefik_traefik_proxy
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true

        - traefik.http.services.second-brain-mcp.loadbalancer.server.port=3000

        - traefik.http.routers.second-brain-mcp.rule=Host(`second-brain.local.barlito.fr`)
        - traefik.http.routers.second-brain-mcp.entrypoints=http
        # Never serve /mcp (Bearer tokens) over plain HTTP
        - traefik.http.routers.second-brain-mcp.middlewares=redirect-to-https@file

        - traefik.http.routers.second-brain-mcp-secure.rule=Host(`second-brain.local.barlito.fr`)
        - traefik.http.routers.second-brain-mcp-secure.entrypoints=https
        - traefik.http.routers.second-brain-mcp-secure.tls=true
        # Own Bearer-token ACL -> no Authelia, just security headers
        - traefik.http.routers.second-brain-mcp-secure.middlewares=security-headers@file

networks:
  traefik_traefik_proxy:
    external: true
