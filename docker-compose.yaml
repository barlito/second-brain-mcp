# ────────────────────────────────────────────────────────────────
# MCP server exposing the shared knowledge base (Obsidian-compatible
# Git vault) to Claude, with per-project access tokens.
# ────────────────────────────────────────────────────────────────
#
# LOCAL dev file, deployed via Docker Swarm like prod. Swarm ignores
# `build:` at deploy time, so `make deploy` runs `docker compose build`
# first to produce the `second-brain-mcp:${IMAGE_TAG}` tag referenced below (unique per build, so the stack rolls)
# (no registry needed on a single-node Swarm).
#
# See docker-compose-prod.yml for the production variant.
services:
  second-brain-mcp:
    build: .
    image: second-brain-mcp:${IMAGE_TAG:-local}
    # Both mounts below are bind mounts owned by the host user, not the
    # image's appuser — run as the host uid/gid (set by `make deploy`)
    # instead. Prod uses named volumes owned by appuser (see Dockerfile),
    # so it doesn't need this.
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - VAULT_PATH=/vault
      - DB_PATH=/data/acl.db
      # No VAULT_REMOTE_URL locally: the vault is a plain local git repo.
      - VAULT_BRANCH=main
      - VAULT_SYNC_INTERVAL_MS=60000
      # Per-agent working memory stays small (see README "Space limits")
      # Token-less sessions: sliding idle expiry and abuse limits (defaults shown)
      - SESSION_IDLE_DAYS=1
      - ACCESS_MAX_PENDING_TOTAL=20
      - ANON_INIT_PER_MIN=10
      - ANON_ACCESS_REQUESTS_PER_HOUR=10
      - SPACE_LIMITS=agents:maxNotes=30,maxNoteBytes=4096,maxProjectBytes=102400,archiveAfterDays=60
      # Shown in the ready-to-paste `claude mcp add` command after token creation
      - PUBLIC_MCP_URL=https://second-brain.local.barlito.fr/mcp
      # Swarm DNS for the Traefik tasks: only they may set X-Forwarded-For.
      - TRUSTED_PROXY=tasks.traefik_traefik
      # Web admin UI (behind Authelia): own port, only users in this group
      - ADMIN_WEB_PORT=3002
      - ADMIN_GROUP=admins
      # traefik-base names the local Authelia cookie differently (prod uses the default)
      - AUTHELIA_SESSION_COOKIE=authelia_session_local
      # Shared secret Traefik injects (X-SB-Admin-Proxy) after Authelia, and the CSRF key
      - ADMIN_PROXY_SECRET=${ADMIN_PROXY_SECRET:?ADMIN_PROXY_SECRET is required (make deploy generates it)}
      - ADMIN_WEB_SECRET=${ADMIN_WEB_SECRET:?ADMIN_WEB_SECRET is required (make deploy generates it)}
      # git refuses to commit without an identity
      - GIT_AUTHOR_NAME=second-brain-mcp
      - GIT_AUTHOR_EMAIL=second-brain-mcp@noreply.local
      - GIT_COMMITTER_NAME=second-brain-mcp
      - GIT_COMMITTER_EMAIL=second-brain-mcp@noreply.local
    # One git working tree + one SQLite file: two tasks must never overlap.
    stop_grace_period: 30s
    volumes:
      - ../second-brain-vault-dev:/vault
      - ./data:/data
    networks:
      - traefik_traefik_proxy
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true

        - traefik.http.services.second-brain-mcp.loadbalancer.server.port=3000
        - traefik.http.services.second-brain-admin.loadbalancer.server.port=3002

        - traefik.http.routers.second-brain-mcp.rule=Host(`second-brain.local.barlito.fr`)
        - traefik.http.routers.second-brain-mcp.service=second-brain-mcp
        - traefik.http.routers.second-brain-mcp.entrypoints=http
        # Never serve /mcp (Bearer tokens) over plain HTTP
        - traefik.http.routers.second-brain-mcp.middlewares=redirect-to-https@file

        - traefik.http.routers.second-brain-mcp-secure.rule=Host(`second-brain.local.barlito.fr`)
        - traefik.http.routers.second-brain-mcp-secure.service=second-brain-mcp
        - traefik.http.routers.second-brain-mcp-secure.entrypoints=https
        - traefik.http.routers.second-brain-mcp-secure.tls=true
        # Own Bearer-token ACL -> no Authelia, just security headers
        - traefik.http.routers.second-brain-mcp-secure.middlewares=security-headers@file

        # Web admin UI: Authelia SSO (Remote-User/Remote-Groups), never exposed without it
        - traefik.http.routers.second-brain-admin.rule=Host(`second-brain-admin.local.barlito.fr`)
        - traefik.http.routers.second-brain-admin.service=second-brain-admin
        - traefik.http.routers.second-brain-admin.entrypoints=http
        - traefik.http.routers.second-brain-admin.middlewares=redirect-to-https@file

        - traefik.http.routers.second-brain-admin-secure.rule=Host(`second-brain-admin.local.barlito.fr`)
        - traefik.http.routers.second-brain-admin-secure.service=second-brain-admin
        - traefik.http.routers.second-brain-admin-secure.entrypoints=https
        - traefik.http.routers.second-brain-admin-secure.tls=true
        # Injected after Authelia (overwrites any client value): proves the request went through Traefik
        - traefik.http.middlewares.second-brain-admin-proxy.headers.customrequestheaders.X-SB-Admin-Proxy=${ADMIN_PROXY_SECRET:?ADMIN_PROXY_SECRET is required (make deploy generates it)}
        - traefik.http.routers.second-brain-admin-secure.middlewares=authelia-auth@file,second-brain-admin-proxy,security-headers@file

networks:
  traefik_traefik_proxy:
    external: true
